name: CD
on:
  push:
    branches: [main]
jobs:
  docker:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build image
        run: docker build -t ghcr.io/${{ github.repository_owner }}/smart-attendance:${{ github.sha }} .
      - name: Push image
        run: docker push ghcr.io/${{ github.repository_owner }}/smart-attendance:${{ github.sha }}
