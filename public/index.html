<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Smart Attendance | DevOps LAB</title>
<style>
:root{--bg:#f4f7fb;--card:#fff;--text:#172033;--muted:#667085;--primary:#315bea;--primary2:#7c3aed;--line:#e7eaf0;--green:#16a34a;--red:#dc2626;--shadow:0 12px 35px #1d29391a}
*{box-sizing:border-box}body{margin:0;font-family:Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,Arial;background:linear-gradient(135deg,#eef3ff,#f9fbff 55%,#f3efff);color:var(--text);min-height:100vh}
button,input,select{font:inherit}button{border:0;cursor:pointer}.hidden{display:none!important}.shell{display:flex;min-height:100vh}.sidebar{width:250px;background:#101828;color:white;padding:26px 18px;position:fixed;inset:0 auto 0 0}.brand{font-size:22px;font-weight:800;margin-bottom:32px}.brand span{color:#8ea7ff}.nav button{width:100%;background:transparent;color:#cbd5e1;text-align:left;padding:12px 14px;border-radius:10px;margin:3px 0}.nav button:hover,.nav button.active{background:#ffffff16;color:white}.main{margin-left:250px;width:calc(100% - 250px);padding:30px 38px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:28px}.eyebrow{color:var(--primary);font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:.08em}.top h1{margin:4px 0;font-size:30px}.user-chip{background:white;padding:10px 14px;border-radius:12px;box-shadow:var(--shadow);font-weight:600}.btn{padding:10px 15px;border-radius:9px;background:var(--primary);color:white;font-weight:700}.btn.secondary{background:#eef2ff;color:#315bea}.btn.danger{background:#fee2e2;color:#b91c1c}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}.stat{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px;box-shadow:var(--shadow)}.stat small{color:var(--muted)}.stat strong{display:block;font-size:30px;margin-top:8px}.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:22px;box-shadow:var(--shadow);margin-top:18px}.card h2{margin:0 0 16px}.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:14px}.form-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.field label{display:block;font-size:12px;font-weight:700;color:var(--muted);margin-bottom:5px}.field input,.field select{width:100%;padding:11px;border:1px solid #d0d5dd;border-radius:9px;background:white}.table-wrap{overflow:auto}table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:13px 10px;border-bottom:1px solid var(--line);white-space:nowrap}th{font-size:12px;text-transform:uppercase;color:var(--muted)}.badge{display:inline-block;padding:5px 9px;border-radius:999px;font-size:12px;font-weight:700}.present{background:#dcfce7;color:#15803d}.absent{background:#fee2e2;color:#b91c1c}.login-page{min-height:100vh;display:grid;place-items:center;padding:20px}.login-card{width:min(460px,100%);background:white;padding:36px;border-radius:24px;box-shadow:0 25px 70px #34405425}.logo{font-size:28px;font-weight:900;margin-bottom:8px}.logo span{color:var(--primary)}.login-card p{color:var(--muted)}.login-card .field{margin-top:15px}.login-card .btn{width:100%;margin-top:20px;padding:13px}.demo{background:#f8faff;border:1px solid #e0e7ff;border-radius:12px;padding:12px;margin-top:16px;font-size:13px;color:#475467}.msg{margin-top:10px;font-weight:600}.success{color:var(--green)}.error{color:var(--red)}.empty{padding:30px;text-align:center;color:var(--muted)}@media(max-width:900px){.sidebar{width:200px}.main{margin-left:200px;width:calc(100% - 200px);padding:22px}.grid{grid-template-columns:repeat(2,1fr)}.form-grid{grid-template-columns:1fr 1fr}}@media(max-width:650px){.sidebar{position:static;width:100%;height:auto}.shell{display:block}.main{margin:0;width:100%;padding:18px}.grid,.form-grid{grid-template-columns:1fr}.nav{display:flex;gap:5px;overflow:auto}.nav button{white-space:nowrap}.top{align-items:flex-start;gap:10px}}
</style></head>
<body>
<div id="loginPage" class="login-page"><div class="login-card"><div class="logo">Smart <span>Attendance</span></div><p>DevOps-enabled attendance management for your LAB project.</p>
<div class="field"><label>Email</label><input id="email" value="student@demo.local"></div>
<div class="field"><label>Password</label><input id="password" type="password" value="Student@123"></div>
<button class="btn" onclick="login()">Sign in</button><div id="loginMsg" class="msg"></div>
<div class="demo"><b>Demo accounts</b><br>Student: student@demo.local / Student@123<br>Teacher: teacher@demo.local / Teacher@123<br>Admin: admin@demo.local / Admin@123</div></div></div>

<div id="app" class="shell hidden"><aside class="sidebar"><div class="brand">Smart <span>Attendance</span></div><div id="nav" class="nav"></div></aside>
<main class="main"><div class="top"><div><div class="eyebrow">DevOps LAB</div><h1 id="title">Dashboard</h1></div><div class="user-chip" id="userChip"></div></div><div id="content"></div></main></div>
<script>
let me=null;
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function api(url,opt={}){opt.headers={...(opt.headers||{}),'x-user-id':me.id,'x-user-role':me.role,'Content-Type':'application/json'};const r=await fetch(url,opt);const d=await r.json();if(!r.ok)throw Error(d.message||'Request failed');return d}
async function login(){try{const r=await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:$('email').value,password:$('password').value})});const d=await r.json();if(!r.ok)throw Error(d.message);me=d;$('loginPage').classList.add('hidden');$('app').classList.remove('hidden');$('userChip').textContent=me.name+' · '+me.role;buildNav();home()}catch(e){$('loginMsg').className='msg error';$('loginMsg').textContent=e.message}}
function buildNav(){const items=me.role==='ADMIN'?['Dashboard','Students','Teachers','Classes']:me.role==='TEACHER'?['Dashboard','Mark Attendance']:['Dashboard','My Attendance'];$('nav').innerHTML=items.map(x=>'<button onclick="go(\''+x+'\')">'+x+'</button>').join('')+'<button onclick="location.reload()">Logout</button>'}
function go(page){document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.textContent===page));$('title').textContent=page;({Dashboard:home,Students:students,Teachers:teachers,Classes:classes,'Mark Attendance':markAttendance,'My Attendance':myAttendance}[page]||home)()}
async function home(){if(me.role==='STUDENT')return myAttendance();if(me.role==='TEACHER')return markAttendance();const d=await api('/api/admin/data');$('content').innerHTML='<div class="grid"><div class="stat"><small>Students</small><strong>'+d.students.length+'</strong></div><div class="stat"><small>Teachers</small><strong>'+d.teachers.length+'</strong></div><div class="stat"><small>Classes</small><strong>'+d.classes.length+'</strong></div><div class="stat"><small>System</small><strong>Online</strong></div></div><div class="card"><h2>Admin overview</h2><p>Manage students, teachers and classes from the sidebar. Teachers can record attendance and students can view their attendance history.</p></div>'}
async function myAttendance(){const d=await api('/api/student/attendance');$('content').innerHTML='<div class="grid"><div class="stat"><small>Total Records</small><strong>'+d.total+'</strong></div><div class="stat"><small>Present</small><strong>'+d.present+'</strong></div><div class="stat"><small>Attendance</small><strong>'+d.percentage+'%</strong></div><div class="stat"><small>Status</small><strong>'+(d.percentage>=75?'Good':'Low')+'</strong></div></div><div class="card"><h2>My Attendance History</h2>'+table(d.rows,['date','className','status'])+'</div>'}
function table(rows,cols){if(!rows.length)return '<div class="empty">No records yet.</div>';return '<div class="table-wrap"><table><thead><tr>'+cols.map(c=>'<th>'+esc(c)+'</th>').join('')+'</tr></thead><tbody>'+rows.map(r=>'<tr>'+cols.map(c=>'<td>'+((c==='status')?'<span class="badge '+r[c].toLowerCase()+'">'+esc(r[c])+'</span>':esc(r[c]))+'</td>').join('')+'</tr>').join('')+'</tbody></table></div>'}
async function students(){const d=await api('/api/admin/data');$('content').innerHTML='<div class="card"><h2>Add Student</h2><div class="form-grid"><div class="field"><label>Name</label><input id="sn"></div><div class="field"><label>Email</label><input id="se"></div><div class="field"><label>Roll No</label><input id="sr"></div><div class="field"><label>Department</label><input id="sd" value="CSE"></div><div class="field"><label>Semester</label><input id="ss" type="number" value="6"></div></div><br><button class="btn" onclick="addStudent()">Add Student</button><div id="msg" class="msg"></div></div><div class="card"><h2>Students</h2>'+d.students.map(s=>'<div class="toolbar"><b>'+esc(s.rollNo)+'</b> — '+esc(s.name)+' · '+esc(s.email)+'<span style="flex:1"></span><button class="btn danger" onclick="removeStudent('+s.id+')">Remove</button></div>').join('')+'</div>'}
async function addStudent(){try{await api('/api/admin/students',{method:'POST',body:JSON.stringify({name:$('sn').value,email:$('se').value,rollNo:$('sr').value,department:$('sd').value,semester:$('ss').value})});students()}catch(e){$('msg').textContent=e.message;$('msg').className='msg error'}}
async function removeStudent(id){if(confirm('Remove this student?')){await api('/api/admin/students/'+id,{method:'DELETE'});students()}}
async function teachers(){const d=await api('/api/admin/data');$('content').innerHTML='<div class="card"><h2>Add Teacher</h2><div class="form-grid"><div class="field"><label>Name</label><input id="tn"></div><div class="field"><label>Email</label><input id="te"></div><div class="field"><label>Employee No</label><input id="tem"></div><div class="field"><label>Department</label><input id="td" value="CSE"></div></div><br><button class="btn" onclick="addTeacher()">Add Teacher</button><div id="msg" class="msg"></div></div><div class="card"><h2>Teachers</h2>'+d.teachers.map(t=>'<div class="toolbar"><b>'+esc(t.employeeNo)+'</b> — '+esc(t.name)+' · '+esc(t.email)+'<span style="flex:1"></span><button class="btn danger" onclick="removeTeacher('+t.id+')">Remove</button></div>').join('')+'</div>'}
async function addTeacher(){try{await api('/api/admin/teachers',{method:'POST',body:JSON.stringify({name:$('tn').value,email:$('te').value,employeeNo:$('tem').value,department:$('td').value})});teachers()}catch(e){$('msg').textContent=e.message;$('msg').className='msg error'}}
async function removeTeacher(id){if(confirm('Remove this teacher?')){await api('/api/admin/teachers/'+id,{method:'DELETE'});teachers()}}
async function classes(){const d=await api('/api/admin/data');$('content').innerHTML='<div class="card"><h2>Create Class</h2><div class="form-grid"><div class="field"><label>Class</label><input id="cn" placeholder="CSE-6C"></div><div class="field"><label>Subject</label><input id="cs" placeholder="Cloud Computing"></div><div class="field"><label>Teacher</label><select id="ct"><option value="">Unassigned</option>'+d.teachers.map(t=>'<option value="'+t.id+'">'+esc(t.name)+'</option>').join('')+'</select></div></div><br><button class="btn" onclick="addClass()">Create Class</button><div id="msg" class="msg"></div></div><div class="card"><h2>Classes</h2>'+table(d.classes.map(c=>({...c,teacher:d.teachers.find(t=>t.id===c.teacherId)?.name||'Unassigned'})),['name','subject','teacher'])+d.classes.map(c=>'<button class="btn danger" style="margin:5px" onclick="removeClass('+c.id+')">Remove '+esc(c.name)+'</button>').join('')+'</div>'}
async function addClass(){try{await api('/api/admin/classes',{method:'POST',body:JSON.stringify({name:$('cn').value,subject:$('cs').value,teacherId:$('ct').value})});classes()}catch(e){$('msg').textContent=e.message;$('msg').className='msg error'}}
async function removeClass(id){if(confirm('Remove this class?')){await api('/api/admin/classes/'+id,{method:'DELETE'});classes()}}
async function markAttendance(){const d=await api('/api/teacher/data');$('content').innerHTML='<div class="card"><h2>Mark Attendance</h2><div class="toolbar"><select id="mc">'+d.classes.map(c=>'<option value="'+c.id+'">'+esc(c.name)+' — '+esc(c.subject)+'</option>').join('')+'</select><input id="md" type="date" value="'+new Date().toISOString().slice(0,10)+'"></div><div id="roster"></div><button class="btn" onclick="saveAttendance()">Save Attendance</button><div id="msg" class="msg"></div></div>';renderRoster(d.students)}
function renderRoster(students){$('roster').innerHTML='<div class="table-wrap"><table><thead><tr><th>Roll No</th><th>Student</th><th>Status</th></tr></thead><tbody>'+students.map(s=>'<tr><td>'+esc(s.rollNo)+'</td><td>'+esc(s.name)+'</td><td><select class="st" data-id="'+s.id+'"><option>PRESENT</option><option>ABSENT</option></select></td></tr>').join('')+'</tbody></table></div>'}
async function saveAttendance(){try{const records=[...document.querySelectorAll('.st')].map(x=>({studentId:x.dataset.id,status:x.value}));await api('/api/teacher/attendance',{method:'POST',body:JSON.stringify({classId:$('mc').value,date:$('md').value,records})});$('msg').textContent='Attendance saved successfully';$('msg').className='msg success'}catch(e){$('msg').textContent=e.message;$('msg').className='msg error'}}
function homeAfter(){go('Dashboard')} 
</script></body></html>
