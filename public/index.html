<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Smart Attendance | DevOps LAB</title>
<style>
:root{--bg:#f4f7fb;--card:#fff;--text:#172033;--muted:#667085;--primary:#315bea;--primary2:#7c3aed;--line:#e7eaf0;--green:#16a34a;--red:#dc2626;--amber:#b45309;--shadow:0 12px 35px #1d29391a}
*{box-sizing:border-box}body{margin:0;font-family:Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,Arial;background:linear-gradient(135deg,#eef3ff,#f9fbff 55%,#f3efff);color:var(--text);min-height:100vh}
button,input,select{font:inherit}button{border:0;cursor:pointer}.hidden{display:none!important}.shell{display:flex;min-height:100vh}.sidebar{width:250px;background:#101828;color:white;padding:26px 18px;position:fixed;inset:0 auto 0 0}.brand{font-size:22px;font-weight:800;margin-bottom:32px}.brand span{color:#8ea7ff}.nav button{width:100%;background:transparent;color:#cbd5e1;text-align:left;padding:12px 14px;border-radius:10px;margin:3px 0}.nav button:hover,.nav button.active{background:#ffffff16;color:white}.main{margin-left:250px;width:calc(100% - 250px);padding:30px 38px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:28px}.eyebrow{color:var(--primary);font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:.08em}.top h1{margin:4px 0;font-size:30px}.user-chip{background:white;padding:10px 14px;border-radius:12px;box-shadow:var(--shadow);font-weight:600}.btn{padding:10px 15px;border-radius:9px;background:var(--primary);color:white;font-weight:700}.btn.secondary{background:#eef2ff;color:#315bea}.btn.danger{background:#fee2e2;color:#b91c1c}.btn.success{background:#dcfce7;color:#15803d}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}.stat{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px;box-shadow:var(--shadow)}.stat small{color:var(--muted)}.stat strong{display:block;font-size:30px;margin-top:8px}.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:22px;box-shadow:var(--shadow);margin-top:18px}.card h2{margin:0 0 16px}.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:14px}.form-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.field label{display:block;font-size:12px;font-weight:700;color:var(--muted);margin-bottom:5px}.field input,.field select{width:100%;padding:11px;border:1px solid #d0d5dd;border-radius:9px;background:white}.table-wrap{overflow:auto}table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:13px 10px;border-bottom:1px solid var(--line);white-space:nowrap}th{font-size:12px;text-transform:uppercase;color:var(--muted)}.badge{display:inline-block;padding:5px 9px;border-radius:999px;font-size:12px;font-weight:700}.present{background:#dcfce7;color:#15803d}.absent{background:#fee2e2;color:#b91c1c}.warning{background:#fef3c7;color:#92400e}.ok{background:#dcfce7;color:#166534}.alert{border-left:5px solid #f59e0b;background:#fffbeb}.chart{height:300px;position:relative;padding:10px 0}.chart svg{width:100%;height:100%;overflow:visible}.chart-grid{stroke:#e5e7eb;stroke-width:1}.chart-line{fill:none;stroke:#315bea;stroke-width:4;stroke-linecap:round;stroke-linejoin:round}.chart-dot{fill:#315bea}.chart-label{fill:#667085;font-size:11px}.bar-list{display:grid;gap:14px}.bar-row{display:grid;grid-template-columns:180px 1fr 60px;gap:10px;align-items:center}.bar-track{height:14px;background:#edf0f5;border-radius:999px;overflow:hidden}.bar-fill{height:100%;background:linear-gradient(90deg,#315bea,#7c3aed);border-radius:999px}.pipeline{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}.stage{border:1px solid var(--line);border-radius:12px;padding:15px;text-align:center}.stage .dot{width:12px;height:12px;border-radius:50%;background:#16a34a;margin:0 auto 8px}.progress{height:10px;background:#edf0f5;border-radius:999px;overflow:hidden}.progress span{display:block;height:100%;background:linear-gradient(90deg,#315bea,#7c3aed);border-radius:999px}.login-page{min-height:100vh;display:grid;place-items:center;padding:20px}.login-card{width:min(460px,100%);background:white;padding:36px;border-radius:24px;box-shadow:0 25px 70px #34405425}.logo{font-size:28px;font-weight:900;margin-bottom:8px}.logo span{color:var(--primary)}.login-card p{color:var(--muted)}.login-card .field{margin-top:15px}.login-card .btn{width:100%;margin-top:20px;padding:13px}.demo{background:#f8faff;border:1px solid #e0e7ff;border-radius:12px;padding:12px;margin-top:16px;font-size:13px;color:#475467}.msg{margin-top:10px;font-weight:600}.success{color:var(--green)}.error{color:var(--red)}.empty{padding:30px;text-align:center;color:var(--muted)}.muted{color:var(--muted)}.link{color:var(--primary);font-weight:700;text-decoration:none}.inline{display:inline-flex;gap:8px;align-items:center}@media(max-width:1000px){.sidebar{width:200px}.main{margin-left:200px;width:calc(100% - 200px);padding:22px}.grid,.grid3{grid-template-columns:repeat(2,1fr)}.form-grid{grid-template-columns:1fr 1fr}.pipeline{grid-template-columns:1fr 1fr}}@media(max-width:650px){.sidebar{position:static;width:100%;height:auto}.shell{display:block}.main{margin:0;width:100%;padding:18px}.grid,.grid3,.form-grid{grid-template-columns:1fr}.nav{display:flex;gap:5px;overflow:auto}.nav button{white-space:nowrap}.top{align-items:flex-start;gap:10px}.bar-row{grid-template-columns:110px 1fr 45px}.pipeline{grid-template-columns:1fr}}
</style></head>
<body>
<div id="loginPage" class="login-page"><div class="login-card"><div class="logo">Smart <span>Attendance</span></div><p>Simple attendance management with a complete DevOps demonstration.</p>
<div class="field"><label>Email</label><input id="email" value="student@demo.local"></div>
<div class="field"><label>Password</label><input id="password" type="password" value="Student@123"></div>
<button class="btn" onclick="login()">Sign in</button><div id="loginMsg" class="msg"></div>
<div class="demo"><b>Demo accounts</b><br>Student: student@demo.local / Student@123<br>Teacher: teacher@demo.local / Teacher@123<br>Admin: admin@demo.local / Admin@123</div></div></div>

<div id="app" class="shell hidden"><aside class="sidebar"><div class="brand">Smart <span>Attendance</span></div><div id="nav" class="nav"></div></aside>
<main class="main"><div class="top"><div><div class="eyebrow">DevOps LAB</div><h1 id="title">Dashboard</h1></div><div class="user-chip" id="userChip"></div></div><div id="content"></div></main></div>
<script>
let me=null;const $=id=>document.getElementById(id);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function api(url,opt={}){opt.headers={...(opt.headers||{}),'x-user-id':me.id,'x-user-role':me.role,'Content-Type':'application/json'};const r=await fetch(url,opt);const d=await r.json();if(!r.ok)throw Error(d.message||'Request failed');return d}
async function login(){try{const r=await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:$('email').value,password:$('password').value})});const d=await r.json();if(!r.ok)throw Error(d.message);me=d;$('loginPage').classList.add('hidden');$('app').classList.remove('hidden');$('userChip').textContent=me.name+' · '+me.role;buildNav();home()}catch(e){$('loginMsg').className='msg error';$('loginMsg').textContent=e.message}}
function buildNav(){const items=me.role==='ADMIN'?['Dashboard','Students','Teachers','Classes','Audit Log','DevOps Monitor']:me.role==='TEACHER'?['Dashboard','Mark Attendance','Analytics']:['Dashboard','My Attendance'];$('nav').innerHTML=items.map(x=>'<button onclick="go(\''+x+'\')">'+x+'</button>').join('')+'<button onclick="location.reload()">Logout</button>'}
function go(page){document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.textContent===page));$('title').textContent=page;({Dashboard:home,Students:students,Teachers:teachers,Classes:classes,'Audit Log':audit,'DevOps Monitor':devops,'Mark Attendance':markAttendance,Analytics:teacherAnalytics,'My Attendance':myAttendance}[page]||home)()}
async function home(){if(me.role==='STUDENT')return myAttendance();if(me.role==='TEACHER')return teacherDashboard();const d=await api('/api/admin/data');$('content').innerHTML='<div class="grid"><div class="stat"><small>Students</small><strong>'+d.students.length+'</strong></div><div class="stat"><small>Teachers</small><strong>'+d.teachers.length+'</strong></div><div class="stat"><small>Classes</small><strong>'+d.classes.length+'</strong></div><div class="stat"><small>Overall Attendance</small><strong>'+d.overallPercentage+'%</strong></div></div>'+(d.lowStudents.length?'<div class="card alert"><h2>Low Attendance Alerts</h2><p>'+d.lowStudents.length+' student(s) are below '+d.threshold+'% attendance.</p>'+d.lowStudents.map(s=>'<span class="badge warning">'+esc(s.name)+' · '+s.percentage+'%</span> ').join('')+'</div>':'<div class="card"><h2>Attendance Status</h2><p class="muted">No students are currently below the '+d.threshold+'% alert threshold.</p></div>')+'<div class="card"><h2>Attendance by Subject</h2>'+barChart(d.subjectAnalytics)+'</div>'}
function barChart(rows){if(!rows.length)return '<div class="empty">No attendance records yet.</div>';return '<div class="bar-list">'+rows.map(r=>'<div class="bar-row"><b>'+esc(r.subject)+'</b><div class="bar-track"><div class="bar-fill" style="width:'+r.percentage+'%"></div></div><strong>'+r.percentage+'%</strong></div>').join('')+'</div>'}
function studentSubjectChart(rows){return '<div class="bar-list">'+rows.map(r=>'<div class="bar-row"><b>'+esc(r.subject)+'</b><div class="bar-track"><div class="bar-fill" style="width:'+r.percentage+'%"></div></div><strong>'+r.percentage+'%</strong></div>').join('')+'</div>'}
async function myAttendance(){const d=await api('/api/student/attendance');const trend=d.trend||[];const low=d.lowAttendance;$('content').innerHTML='<div class="grid"><div class="stat"><small>Total Classes</small><strong>'+d.total+'</strong></div><div class="stat"><small>Present</small><strong>'+d.present+'</strong></div><div class="stat"><small>Attendance Till Date</small><strong>'+d.percentage+'%</strong><div class="progress"><span style="width:'+d.percentage+'%"></span></div></div><div class="stat"><small>Status</small><strong>'+(low?'Low':'Good')+'</strong></div></div>'+(low?'<div class="card alert"><h2>⚠ Low Attendance Warning</h2><p>Your attendance is '+d.percentage+'%, below the '+d.threshold+'% threshold. Attend upcoming classes regularly to improve the percentage.</p></div>':'')+'<div class="card"><div class="toolbar"><h2 style="margin:0;flex:1">Subject-wise Analysis</h2><button class="btn secondary" onclick="location.href=\'/api/student/attendance.csv\'">Export CSV</button></div>'+studentSubjectChart(d.subjects)+'</div><div class="card"><h2>Attendance Trend — Till Date</h2><p class="muted">Daily attendance percentage based on recorded classes.</p><div class="chart" id="trendChart"></div></div><div class="card"><h2>My Attendance History</h2>'+table(d.rows,['date','className','subject','status'])+'</div>';drawTrend(trend)}
function drawTrend(rows){const el=$('trendChart');if(!rows.length){el.innerHTML='<div class="empty">No attendance data yet.</div>';return}const w=760,h=270,p=42;const pts=rows.map((r,i)=>{const x=p+(i*Math.max(1,(w-p*2)/(Math.max(1,rows.length-1))));const y=h-p-(r.percentage/100)*(h-p*2);return{x,y,label:r.date.slice(5),value:r.percentage}});const path=pts.map((p,i)=>(i?'L':'M')+' '+p.x+' '+p.y).join(' ');const grid=[25,50,75,100].map(v=>{const y=h-p-(v/100)*(h-p*2);return '<line class="chart-grid" x1="'+p+'" x2="'+(w-p)+'" y1="'+y+'" y2="'+y+'"/><text class="chart-label" x="5" y="'+(y+4)+'">'+v+'%</text>'}).join('');const dots=pts.map(x=>'<circle class="chart-dot" cx="'+x.x+'" cy="'+x.y+'" r="5"><title>'+x.label+': '+x.value+'%</title></circle>').join('');const labels=pts.map(x=>'<text class="chart-label" text-anchor="middle" x="'+x.x+'" y="'+(h-8)+'">'+x.label+'</text>').join('');el.innerHTML='<svg viewBox="0 0 '+w+' '+h+'">'+grid+'<path class="chart-line" d="'+path+'"/>'+dots+labels+'</svg>'}
function table(rows,cols){if(!rows.length)return '<div class="empty">No records yet.</div>';return '<div class="table-wrap"><table><thead><tr>'+cols.map(c=>'<th>'+esc(c)+'</th>').join('')+'</tr></thead><tbody>'+rows.map(r=>'<tr>'+cols.map(c=>'<td>'+((c==='status')?'<span class="badge '+String(r[c]).toLowerCase()+'">'+esc(r[c])+'</span>':esc(r[c]))+'</td>').join('')+'</tr>').join('')}</tbody></table></div>'}
async function students(){const d=await api('/api/admin/data');$('content').innerHTML='<div class="card"><h2>Add Student</h2><div class="form-grid"><div class="field"><label>Name</label><input id="sn"></div><div class="field"><label>Email</label><input id="se"></div><div class="field"><label>Roll No</label><input id="sr"></div><div class="field"><label>Department</label><input id="sd" value="CSE"></div><div class="field"><label>Semester</label><input id="ss" type="number" value="6"></div></div><br><button class="btn" onclick="addStudent()">Add Student</button><div id="msg" class="msg"></div></div><div class="card"><div class="toolbar"><h2 style="margin:0;flex:1">Students</h2><input id="studentSearch" placeholder="Search name / roll / email" oninput="filterStudents()"><button class="btn secondary" onclick="location.href=\'/api/admin/attendance.csv\'">Export Attendance CSV</button></div><div id="studentList">'+studentRows(d.students)+'</div></div>'}
function studentRows(rows){return rows.map(s=>'<div class="toolbar student-row" data-search="'+esc((s.name+' '+s.rollNo+' '+s.email).toLowerCase())+'"><b>'+esc(s.rollNo)+'</b> — '+esc(s.name)+' · '+esc(s.email)+'<span style="flex:1"></span>'+(s.lowAttendance?'<span class="badge warning">Low attendance</span> ':'')+'<button class="btn danger" onclick="removeStudent('+s.id+')">Remove</button></div>').join('')||'<div class="empty">No students.</div>'}
function filterStudents(){const q=$('studentSearch').value.toLowerCase();document.querySelectorAll('.student-row').forEach(x=>x.style.display=x.dataset.search.includes(q)?'flex':'none')}
async function addStudent(){try{await api('/api/admin/students',{method:'POST',body:JSON.stringify({name:$('sn').value,email:$('se').value,rollNo:$('sr').value,department:$('sd').value,semester:$('ss').value})});students()}catch(e){$('msg').textContent=e.message;$('msg').className='msg error'}}
async function removeStudent(id){if(confirm('Remove this student?')){await api('/api/admin/students/'+id,{method:'DELETE'});students()}}
async function teachers(){const d=await api('/api/admin/data');$('content').innerHTML='<div class="card"><h2>Add Teacher</h2><div class="form-grid"><div class="field"><label>Name</label><input id="tn"></div><div class="field"><label>Email</label><input id="te"></div><div class="field"><label>Employee No</label><input id="tem"></div><div class="field"><label>Department</label><input id="td" value="CSE"></div></div><br><button class="btn" onclick="addTeacher()">Add Teacher</button><div id="msg" class="msg"></div></div><div class="card"><div class="toolbar"><h2 style="margin:0;flex:1">Teachers</h2><input id="teacherSearch" placeholder="Search teacher" oninput="filterTeachers()"></div><div id="teacherList">'+teacherRows(d.teachers)+'</div></div>'}
function teacherRows(rows){return rows.map(t=>'<div class="toolbar teacher-row" data-search="'+esc((t.name+' '+t.email+' '+t.employeeNo).toLowerCase())+'"><b>'+esc(t.employeeNo)+'</b> — '+esc(t.name)+' · '+esc(t.email)+'<span style="flex:1"></span><button class="btn danger" onclick="removeTeacher('+t.id+')">Remove</button></div>').join('')||'<div class="empty">No teachers.</div>'}
function filterTeachers(){const q=$('teacherSearch').value.toLowerCase();document.querySelectorAll('.teacher-row').forEach(x=>x.style.display=x.dataset.search.includes(q)?'flex':'none')}
async function addTeacher(){try{await api('/api/admin/teachers',{method:'POST',body:JSON.stringify({name:$('tn').value,email:$('te').value,employeeNo:$('tem').value,department:$('td').value})});teachers()}catch(e){$('msg').textContent=e.message;$('msg').className='msg error'}}
async function removeTeacher(id){if(confirm('Remove this teacher?')){await api('/api/admin/teachers/'+id,{method:'DELETE'});teachers()}}
async function classes(){const d=await api('/api/admin/data');const rows=d.classes.map(c=>({...c,teacher:d.teachers.find(t=>t.id===c.teacherId)?.name||'Unassigned'}));$('content').innerHTML='<div class="card"><h2>Create Class</h2><div class="form-grid"><div class="field"><label>Class</label><input id="cn" placeholder="CSE-6C"></div><div class="field"><label>Subject</label><input id="cs" placeholder="Cloud Computing"></div><div class="field"><label>Teacher</label><select id="ct"><option value="">Unassigned</option>'+d.teachers.map(t=>'<option value="'+t.id+'">'+esc(t.name)+'</option>').join('')+'</select></div></div><br><button class="btn" onclick="addClass()">Create Class</button><div id="msg" class="msg"></div></div><div class="card"><div class="toolbar"><h2 style="margin:0;flex:1">Classes</h2><input id="classSearch" placeholder="Search class / subject" oninput="filterClasses()"></div><div id="classList">'+classRows(rows)+'</div></div>'}
function classRows(rows){return rows.map(c=>'<div class="toolbar class-row" data-search="'+esc((c.name+' '+c.subject+' '+c.teacher).toLowerCase())+'"><b>'+esc(c.name)+'</b> — '+esc(c.subject)+' · Teacher: '+esc(c.teacher)+'<span style="flex:1"></span><button class="btn danger" onclick="removeClass('+c.id+')">Remove</button></div>').join('')||'<div class="empty">No classes.</div>'}
function filterClasses(){const q=$('classSearch').value.toLowerCase();document.querySelectorAll('.class-row').forEach(x=>x.style.display=x.dataset.search.includes(q)?'flex':'none')}
async function addClass(){try{await api('/api/admin/classes',{method:'POST',body:JSON.stringify({name:$('cn').value,subject:$('cs').value,teacherId:$('ct').value})});classes()}catch(e){$('msg').textContent=e.message;$('msg').className='msg error'}}
async function removeClass(id){if(confirm('Remove this class?')){await api('/api/admin/classes/'+id,{method:'DELETE'});classes()}}
async function teacherDashboard(){const d=await api('/api/teacher/data');const avg=d.analytics.length?Math.round(d.analytics.reduce((a,x)=>a+x.percentage,0)/d.analytics.length):0;$('content').innerHTML='<div class="grid"><div class="stat"><small>My Classes</small><strong>'+d.classes.length+'</strong></div><div class="stat"><small>Attendance Records</small><strong>'+d.analytics.reduce((a,x)=>a+x.totalRecords,0)+'</strong></div><div class="stat"><small>Average Attendance</small><strong>'+avg+'%</strong></div><div class="stat"><small>Low Attendance Students</small><strong>'+d.lowStudents.length+'</strong></div></div><div class="card"><h2>Class Analytics</h2>'+classAnalytics(d.analytics)+'</div>'+(d.lowStudents.length?'<div class="card alert"><h2>Low Attendance Alerts</h2>'+d.lowStudents.map(s=>'<span class="badge warning">'+esc(s.name)+' · '+s.percentage+'%</span> ').join('')+'</div>':'')}
function classAnalytics(rows){return rows.length?table(rows,['name','subject','totalRecords','present','percentage']):'<div class="empty">No assigned classes yet.</div>'}
async function teacherAnalytics(){const d=await api('/api/teacher/data');$('content').innerHTML='<div class="card"><div class="toolbar"><h2 style="margin:0;flex:1">Teacher Analytics</h2><button class="btn secondary" onclick="location.href=\'/api/teacher/attendance.csv\'">Export CSV</button></div><p class="muted">Attendance performance for classes assigned to you.</p>'+barChart(d.analytics.map(x=>({subject:x.name+' — '+x.subject,percentage:x.percentage})))+'</div><div class="card"><h2>Students Below '+d.threshold+'%</h2>'+table(d.lowStudents,['rollNo','name','total','percentage'])+'</div>'}
async function markAttendance(){const d=await api('/api/teacher/data');$('content').innerHTML='<div class="card"><h2>Mark Attendance</h2><div class="toolbar"><select id="mc">'+d.classes.map(c=>'<option value="'+c.id+'">'+esc(c.name)+' — '+esc(c.subject)+'</option>').join('')+'</select><input id="md" type="date" value="'+new Date().toISOString().slice(0,10)+'"></div><div class="toolbar"><input id="rosterSearch" placeholder="Filter students" oninput="filterRoster()"></div><div id="roster"></div><button class="btn" onclick="saveAttendance()">Save Attendance</button><div id="msg" class="msg"></div></div>';renderRoster(d.students)}
function renderRoster(students){$('roster').innerHTML='<div class="table-wrap"><table><thead><tr><th>Roll No</th><th>Student</th><th>Status</th></tr></thead><tbody>'+students.map(s=>'<tr class="roster-row" data-search="'+esc((s.name+' '+s.rollNo).toLowerCase())+'"><td>'+esc(s.rollNo)+'</td><td>'+esc(s.name)+'</td><td><select class="st" data-id="'+s.id+'"><option>PRESENT</option><option>ABSENT</option></select></td></tr>').join('')+'</tbody></table></div>'}
function filterRoster(){const q=$('rosterSearch').value.toLowerCase();document.querySelectorAll('.roster-row').forEach(x=>x.style.display=x.dataset.search.includes(q)?'table-row':'none')}
async function saveAttendance(){try{const records=[...document.querySelectorAll('.st')].map(x=>({studentId:x.dataset.id,status:x.value}));await api('/api/teacher/attendance',{method:'POST',body:JSON.stringify({classId:$('mc').value,date:$('md').value,records})});$('msg').textContent='Attendance saved successfully';$('msg').className='msg success'}catch(e){$('msg').textContent=e.message;$('msg').className='msg error'}}
async function audit(){const d=await api('/api/admin/audit');$('content').innerHTML='<div class="card"><div class="toolbar"><h2 style="margin:0;flex:1">Audit Log</h2><span class="muted">Latest 100 actions</span></div>'+table(d.rows,['time','actor','role','action','details'])+'</div>'}
async function devops(){const d=await api('/api/devops/status');$('content').innerHTML='<div class="grid"><div class="stat"><small>Service</small><strong>'+d.status+'</strong></div><div class="stat"><small>Uptime</small><strong>'+d.uptimeText+'</strong></div><div class="stat"><small>Requests</small><strong>'+d.requestCount+'</strong></div><div class="stat"><small>Memory RSS</small><strong>'+d.memoryMB+' MB</strong></div></div><div class="card"><h2>Runtime Monitoring</h2><div class="grid3"><div><b>Environment</b><p>'+esc(d.environment)+'</p></div><div><b>Node.js</b><p>'+esc(d.nodeVersion)+'</p></div><div><b>Commit</b><p style="word-break:break-all">'+esc(d.commit)+'</p></div></div><p class="muted">Last request: '+esc(d.lastRequestAt||'No requests yet')+'</p></div><div class="card"><h2>DevOps Pipeline</h2><div class="pipeline">'+d.pipeline.map(s=>'<div class="stage"><div class="dot"></div><b>'+esc(s.name)+'</b><div class="muted">'+esc(s.status)+'</div><small>'+esc(s.detail)+'</small></div>').join('')+'</div><p class="toolbar" style="margin-top:18px"><a class="link" target="_blank" href="'+d.repository+'">GitHub Repository ↗</a><a class="link" target="_blank" href="'+d.actions+'">GitHub Actions ↗</a></p></div><div class="card"><h2>Live Service Health</h2><p><span class="badge ok">/health OK</span> Render health checks this endpoint before routing traffic.</p></div>'}
</script></body></html>
