<!doctype html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Smart Attendance</title><style>body{font-family:Arial;background:#f4f6f8;margin:0;color:#1f2937}.wrap{max-width:900px;margin:40px auto;padding:20px}.card{background:white;padding:24px;border-radius:12px;box-shadow:0 2px 10px #0001;margin-bottom:20px}input,select,button{padding:10px;margin:6px 4px 6px 0;border:1px solid #ccc;border-radius:6px}button{cursor:pointer;background:#2563eb;color:white;border:0}.hidden{display:none}.stats{display:flex;gap:12px;flex-wrap:wrap}.stat{flex:1;min-width:150px;background:#eef2ff;padding:15px;border-radius:8px}.error{color:#b91c1c}table{width:100%;border-collapse:collapse}th,td{padding:10px;border-bottom:1px solid #ddd;text-align:left}</style></head><body><div class="wrap"><div id="login" class="card"><h1>Smart Attendance</h1><p>Simple DevOps LAB application</p><input id="email" value="student@demo.local" placeholder="Email"><input id="password" type="password" value="Student@123" placeholder="Password"><button onclick="login()">Login</button><p id="loginMsg"></p><small>Demo: student@demo.local / Student@123</small></div><div id="app" class="hidden"><div class="card"><h1>Smart Attendance Dashboard</h1><p id="welcome"></p><button onclick="logout()">Logout</button></div><div class="stats"><div class="stat"><b>Total Classes</b><div id="total">0</div></div><div class="stat"><b>Present</b><div id="present">0</div></div><div class="stat"><b>Attendance</b><div id="percent">0%</div></div></div><div class="card"><h2>Mark Attendance</h2><input id="date" type="date"><select id="subject"><option>DevOps</option><option>Database</option><option>Cloud Computing</option></select><select id="status"><option>PRESENT</option><option>ABSENT</option></select><button onclick="save()">Save Attendance</button><p id="saveMsg"></p></div><div class="card"><h2>Attendance History</h2><table><thead><tr><th>Date</th><th>Subject</th><th>Status</th></tr></thead><tbody id="rows"></tbody></table></div></div></div><script>let user=null;const $=id=>document.getElementById(id);$('date').value=new Date().toISOString().slice(0,10);async function login(){const r=await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:$('email').value,password:$('password').value})});const d=await r.json();if(!r.ok){$('loginMsg').textContent=d.message;return}user=d;$('login').classList.add('hidden');$('app').classList.remove('hidden');$('welcome').textContent='Welcome, '+user.name+' ('+user.role+')';load()}async function load(){const r=await fetch('/api/attendance?studentId='+user.id);const data=await r.json();$('total').textContent=data.length;const p=data.filter(x=>x.status==='PRESENT').length;$('present').textContent=p;$('percent').textContent=(data.length?Math.round(p/data.length*100):0)+'%';$('rows').innerHTML=data.map(x=>'<tr><td>'+x.date+'</td><td>'+x.subject+'</td><td>'+x.status+'</td></tr>').join('')}async function save(){const r=await fetch('/api/attendance',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({date:$('date').value,subject:$('subject').value,status:$('status').value})});const d=await r.json();$('saveMsg').textContent=d.message;load()}function logout(){location.reload()}</script></body></html>
